name: Build Alpha 9 post kit
on:
  push:
    branches:
      - publication/alpha9-announcement-kit-20261122
    paths:
      - 'docs/alpha-release/publications/alpha9-post-kit/**'
      - '.github/workflows/alpha9-post-kit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create ZIP with original images and texts
        run: python3 docs/alpha-release/publications/alpha9-post-kit/create_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: OctoFox-OS-Alpha9-Post-Kit
          path: docs/alpha-release/publications/alpha9-post-kit/OctoFox_OS_Alpha9_Post_Kit.zip
          retention-days: 30
      - name: Commit ZIP to this publication branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alpha-release/publications/alpha9-post-kit/OctoFox_OS_Alpha9_Post_Kit.zip
          if ! git diff --cached --quiet; then
            git commit -m "Add packaged Alpha 9 publication ZIP"
            git push
          fi
